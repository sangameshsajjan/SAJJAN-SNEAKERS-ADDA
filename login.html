<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAJJAN SNEAKERS ADDA Login</title>

  <link rel="stylesheet" href="login.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>

  <!-- Background Glow -->
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <div class="container">

    <!-- Left Side -->
    <div class="left-side">

      <h1>SAJJAN SNEAKERS ADDA</h1>

      <p>
        Discover premium sneakers with futuristic style.
        Step into the next generation of fashion.
      </p>

      <img
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
        alt="Sneaker"
      />

    </div>

    <!-- Right Side -->
    <div class="login-card">

      <h2>Welcome Back 👟</h2>

      <p class="subtitle">
        Login to continue your sneaker journey
      </p>

      <form id="loginForm">

        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <div class="options">

          <label>
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot Password?</a>

        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="social-buttons">

        <button>
          <i class="fa-brands fa-google"></i>
          Google
        </button>

        <button>
          <i class="fa-brands fa-github"></i>
          GitHub
        </button>

      </div>

      <p class="signup-text">
        New here?
        <a href="#">Create Account</a>
      </p>

    </div>

  </div>

  <script src="login.js"></script>

</body>
</html>
